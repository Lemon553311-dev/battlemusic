# =============================================================================
# Forge targets (1.16.5 - 1.20.1). Extra keys:
#   deps.forge / deps.cloth_config (forge artifact)
#   mod.fml_range      - mods.toml loaderVersion (javafml language = Forge major)
#   mod.loader_range   - dependency range on the loader itself
#   mod.mc_range_maven - Minecraft range in Maven syntax
#   mod.pack_format    - pack.mcmeta format (old Forge needs the file for assets)
# =============================================================================

["1.16.5-forge"]
# 1.16.4 is obfuscation/SRG-identical to 1.16.5; 1.16-1.16.3 are separate
# Forge majors and were never verified.
mod.mc_compat = "1.16.4 1.16.5"
mod.mc_releases = "1.16.4,1.16.5"
mod.java_compat = ">=8"
deps.forge = "36.2.34"
deps.cloth_config = "4.16.91"
mod.fml_range = "[35,)"
mod.loader_range = "[35,)"
mod.mc_range_maven = "[1.16.4,1.16.5]"
mod.pack_format = "6"

["1.17.1-forge"]
# Forge never shipped a 1.17.0 release.
mod.mc_compat = "1.17.1"
mod.mc_releases = "1.17.1"
mod.java_compat = ">=16"
deps.forge = "37.1.1"
deps.cloth_config = "5.3.63"
mod.fml_range = "[37,)"
mod.loader_range = "[37,)"
mod.mc_range_maven = "[1.17.1]"
mod.pack_format = "7"

["1.18.2-forge"]
