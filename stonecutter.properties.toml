# Centralized Stonecutter properties.
# Shared keys at the top; per-version overrides in the ["<version>"] sections
# (read in build.gradle.kts via property(...)/findProperty).
#
# Version ladder, grouped by where the //? gates actually change behavior:
#   - HUD registration: HudRenderCallback (<1.21.6) vs HudElementRegistry (>=1.21.6)
#   - HUD draw target:  PoseStack (<1.20) vs GuiGraphics (1.20+) vs GuiGraphicsExtractor (>=26.1)
#   - Blit call:        legacy (<1.21.5) vs RenderPipelines (>=1.21.5)
#   - Registries:       Registry.ENTITY_TYPE (<1.19.3) vs BuiltInRegistries (>=1.19.3)
#   - Warden:           does not exist before 1.19
#   - Non-obf renames:  ResourceLocation etc. become Identifier etc. (>=26.1)

mod.id = "battlemusic"
mod.name = "Battle Music"
mod.group = "me.lemon553311.battlemusic"
mod.version = "1.2.0"
mod.modrinth_id = "battle-music"
# NUMERIC CurseForge project id (from the "About Project" box), not the slug.
mod.curseforge_id = "1595905"

# Fabric API version range for fabric.mod.json's depends block. "*" everywhere
# except 1.16.5, which needs a real runtime floor (see its section).
mod.fabric_api_compat = "*"

# Fabric API's mod id is version-dependent and the compiler never checks it,
# so it must be pinned per tier or the mod refuses to launch even with Fabric
# API installed:
#   pre-1.19.3: "fabric" / 1.19.3-1.21.x: "fabric-api" ("fabric" alias kept)
#   26.1+:      only "fabric-api" (alias removed)
# Consumed as ${fabric_api_id} in fabric.mod.json.
mod.fabric_api_id = "fabric-api"

deps.fabric_loader = "0.19.3"

# ---- 1.16.x ----
["1.16.5-fabric"]
mod.mc_compat = ">=1.16 <=1.16.5"
mod.loader_compat = ">=0.11.3"
mod.mc_releases = "1.16,1.16.1,1.16.2,1.16.3,1.16.4,1.16.5"
mod.java_compat = ">=8"
deps.fabric_api = "0.42.0+1.16"
mod.fabric_api_id = "fabric"
# ClientPlayConnectionEvents first shipped in Fabric API 0.30.0 for 1.16.5;
# older builds crash on init, so reject them up front.
mod.fabric_api_compat = ">=0.30.0"
deps.modmenu = "1.16.23"
deps.cloth_config = "4.16.91"

# ---- 1.17.x ----
