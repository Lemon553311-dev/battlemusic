# =============================================================================
# NeoForge targets (1.20.4+; 1.20.1 covered by the Forge jar). Extra keys:
#   deps.neoforge, deps.cloth_config (neoforge artifact)
#   mod.client_side_only_line - clientSideOnly=true for neoforge.mods.toml (1.20.5+)
#   mod.display_test_line     - mods.toml displayTest instead (1.20.4 only)
# =============================================================================

["1.20.4-neoforge"]
# Covers 1.20.2-1.20.4: NeoForge runs on official mappings from 20.2 and the
# mods.toml switch happens at 1.20.5, so one jar covers the family.
mod.mc_compat = ">=1.20.2 <=1.20.4"
mod.mc_releases = "1.20.2,1.20.3,1.20.4"
mod.java_compat = ">=17"
deps.neoforge = "20.4.237"
deps.cloth_config = "13.0.138"
mod.loader_range = "[20.2,)"
mod.mc_range_maven = "[1.20.2,1.20.4]"
mod.pack_format = "22"
mod.display_test_line = "displayTest=\"IGNORE_ALL_VERSION\""
# REQUIRED: this tier still uses mods.toml, and a missing fml_range expands to
# loaderVersion="" - an unparseable range that makes NeoForge silently drop
# the whole jar from the mod list.
mod.fml_range = "[1,)"

