name: Build & Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_test:
        description: >-
          Also run the Modrinth/CurseForge publish steps on every target in
          dry-run mode. Use this to verify publishing before cutting a real tag.
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # One job per Stonecutter target, in parallel.
  build:
    strategy:
      fail-fast: false
      matrix:
        target:
          - 1.16.5-fabric
          - 1.17.1-fabric
          - 1.18.2-fabric
          - 1.19.2-fabric
          - 1.19.4-fabric
          - 1.20.1-fabric
          - 1.20.4-fabric
          - 1.20.6-fabric
          - 1.21.1-fabric
          - 1.21.4-fabric
          - 1.21.5-fabric
          - 1.21.8-fabric
          - 26.1.2-fabric
          - 26.2-fabric
          - 1.16.5-forge
          - 1.17.1-forge
          - 1.18.2-forge
          - 1.19.2-forge
          - 1.19.4-forge
          - 1.20.1-forge
          - 1.20.4-neoforge
          - 1.20.6-neoforge
          - 1.21.1-neoforge
          - 1.21.4-neoforge
          - 1.21.5-neoforge
          - 1.21.8-neoforge
          - 26.1.2-neoforge
          - 26.2-neoforge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # 17/21/25 as toolchain base; older per-tier JDKs (8, 16) come via foojay.
      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build ${{ matrix.target }}
        # MOD_VERSION must be gated to tags: github.ref_name on a branch push is
        # the branch name. Empty -> build scripts fall back to mod.version.
        run: ./gradlew ":${{ matrix.target }}:buildAndCollect" --configure-on-demand --no-daemon
        env:
          MOD_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

      - name: Collect jars
        run: |
          mkdir -p release
          find build/libs -name '*.jar' -exec cp {} release/ \;
          rm -f release/*-sources.jar release/*-dev.jar release/*-dev-shadow.jar
          ls -la release

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: battlemusic-jars-${{ matrix.target }}
          path: release/*.jar
          if-no-files-found: error

      # Published per-target right after its build (project already configured).
      # Real upload on a v* tag; dry run on a publish_test dispatch.
      - name: Publish ${{ matrix.target }} to Modrinth
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_test)
        run: ./gradlew ":${{ matrix.target }}:modrinth" --configure-on-demand --no-daemon --stacktrace
        env:
          MOD_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_test && 'true' || '' }}

      # Mirror of the Modrinth step above: same v*-tag / publish_test dry-run
      # gating. Needs the CURSEFORGE_TOKEN repo secret (an API token from
      # https://authors.curseforge.com/account/api-tokens) and the numeric
      # mod.curseforge_id in stonecutter.properties.toml.
      - name: Publish ${{ matrix.target }} to CurseForge
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_test)
        run: ./gradlew ":${{ matrix.target }}:publishCurseforge" --configure-on-demand --no-daemon --stacktrace
        env:
          MOD_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_test && 'true' || '' }}

  # Assembles the GitHub Release from the already-built jars. Real tags only.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all built jars
        uses: actions/download-artifact@v7
        with:
          pattern: battlemusic-jars-*
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
          generate_release_notes: true
